# 存成 %USERPROFILE%\.codex\wb.config.toml
# 注意：0.162 起 profile 必须是独立文件，写在 config.toml 里会被判为 legacy 并报错。
#
# 用法：codex --profile wb

model_provider = "workbuddy"
# 选择器里的 slug 带区域前缀：ai/... = 国际版，cn/... = 国内版。
# 不带前缀的旧写法（如 deepseek-v4.1-flash）仍按国际版处理。
model = "cn/deepseek-v4.1-flash"     # 免费档；cn/hy4free、cn/hy3 同样免费
model_reasoning_effort = "low"
model_catalog_json = "<CODEX_HOME>/workbuddy-catalog.json"